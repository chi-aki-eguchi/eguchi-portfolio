<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 1200 1697" font-family="Arial, Hiragino Kaku Gothic ProN, Yu Gothic, sans-serif" fill="#173d36"><rect width="1200" height="1697" fill="#f5f0e5"/><path d="M110 110h66v66" fill="none" stroke="#173d36" stroke-width="3"/><text x="1090" y="130" font-size="22" text-anchor="end" letter-spacing="3">MENU / 01</text><text x="110" y="235" font-size="54" font-weight="600">架空の喫茶室</text><text x="112" y="345" font-size="22" fill="#66746b">季節のお茶と、ひと息の時間。</text><path d="M110 397H1090" stroke="#66746b"/><text x="110" y="490" font-size="30" >本日の珈琲</text><text x="1090" y="490" font-size="29" text-anchor="end">¥550</text><path d="M110 520H1090" stroke="#d7d3c8"/><text x="110" y="596" font-size="30" >深蒸し煎茶</text><text x="1090" y="596" font-size="29" text-anchor="end">¥500</text><path d="M110 626H1090" stroke="#d7d3c8"/><text x="110" y="702" font-size="30" >ほうじ茶ラテ</text><text x="1090" y="702" font-size="29" text-anchor="end">¥650</text><path d="M110 732H1090" stroke="#d7d3c8"/><text x="110" y="808" font-size="30" >季節のチーズケーキ</text><text x="1090" y="808" font-size="29" text-anchor="end">¥680</text><path d="M110 838H1090" stroke="#d7d3c8"/><text x="110" y="914" font-size="30" >焼き菓子の盛り合わせ</text><text x="1090" y="914" font-size="29" text-anchor="end">¥750</text><path d="M110 944H1090" stroke="#d7d3c8"/><text x="110" y="1495" font-size="23" fill="#66746b">表示価格は税込です。</text><text x="110" y="1527" font-size="23" fill="#66746b">アレルギーについてはスタッフへお声がけください。</text><text x="110" y="1600" font-size="21" >ごゆっくり、お楽しみください。</text><circle cx="1080" cy="1590" r="12" fill="#173d36"/></svg>