function render(){document.body.classList.toggle('dark',mode==='archive');document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));let route=location.hash.slice(1)||'home';document.querySelectorAll('.links a').forEach(a=>a.setAttribute('aria-current',a.hash==='#'+route?'page':'false'));main.className='page';if(route==='home'&&mode==='book'){sequence=selected;main.innerHTML=`<div class="intro"><h1>Photographs</h1><p>江口 秋<br>Selected photographs / 01—12</p></div><div class="spread">${selected.slice(0,3).map((p,i)=>photo(p,i)).join('')}</div><div class="sectionline"><h2>Selected photographs</h2><a href="#photos">すべての写真へ ↗</a></div>${[3,5].map(n=>`<div class="pair">${selected.slice(n,n+2).map((p,i)=>photo(p,n+i)).join('')}</div>`).join('')}<div class="spread">${selected.slice(7,10).map((p,i)=>photo(p,i+7)).join('')}</div><div class="pair" style="margin-top:60px">${selected.slice(10,12).map((p,i)=>photo(p,i+10)).join('')}</div><div class="sectionline"><h2>Series</h2><a href="#series">シリーズへ ↗</a></div>${series()}`;}else if(route==='home'||route==='photos'){sequence=DATA.filter(p=>!filter||p.category===filter);main.innerHTML=`<div class="indexintro"><h1>Photographs<span style="font:12px Arial;vertical-align:super;margin-left:12px">${sequence.length}</span></h1><p>江口秋の写真</p></div>${controls()}${grid(sequence)}`;}else if(route==='series'){main.innerHTML=`<div class="intro"><h1>Series</h1><p>まとまりで見る</p></div>${series()}`;}else if(route.startsWith('series-')){let id=Number(route.split('-')[1]);sequence=DATA.filter(p=>p.seriesId===id);main.innerHTML=`<div class="intro"><div><a class="aboutlink" href="#series">← シリーズ一覧</a><h1 style="margin-top:20px">${id===4?'Ishigaki Island':'indigo blue'}</h1></div><p>${sequence.length} photographs</p></div>${grid(sequence)}`;}else if(route==='about'){main.innerHTML=`<article class="about"><img src="${esc(url(byId.get(1755)))}" alt="海辺の写真"><div><p class="eyebrow">Photographer</p><h1>江口 秋<br><span style="font-size:24px">Aki Eguchi</span></h1><p>2007年生まれ、台湾出身。東京在住。<br>日本大学芸術学部写真学科在学。</p><p>ポートレートと日常を、<br>デジタルとフィルムで撮っている。</p><a class="textlink" href="https://akieguchi.com/contact">撮影のご相談 ↗</a><br><a class="textlink" href="https://akieguchi.com/about">プロフィールの全文 ↗</a></div></article>`;}else{location.hash='home';return;}main.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>openPhoto(Number(b.dataset.photo),b));main.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();main.querySelector(`[data-filter="${filter}"]`)?.focus()});let slider=main.querySelector('input');if(slider)slider.oninput=()=>{cols=+slider.value;pack();main.querySelector('output').textContent=cols};pack();}
function pack(){const grid=main.querySelector('.index');if(!grid)return;const buttons=[...grid.children],w=grid.clientWidth,gap=6;grid.style.gap=gap+'px';for(let i=0;i<buttons.length;i+=cols){const row=buttons.slice(i,i+cols),ratios=row.map(b=>{const p=byId.get(+b.dataset.photo);return (p.width||1000)/(p.height||1000)}),sum=ratios.reduce((a,b)=>a+b,0),h=Math.min((w-gap*(row.length-1))/sum,w/cols*1.5);row.forEach((b,j)=>{b.style.width=(h*ratios[j])+'px';b.style.height=h+'px'})}}window.addEventListener('resize',()=>{cols=Math.min(cols,innerWidth<700?5:9);pack()});
function openPhoto(id,button){current=sequence.findIndex(p=>p.id===id);opener=button;drawViewer();dialog.showModal();document.body.style.overflow='hidden'}
function drawViewer(){const p=sequence[current];document.querySelector('.stage').innerHTML=`<img src="${esc(url(p))}" alt="${esc(p.title||'江口秋の写真')}">`;document.querySelector('#count').textContent=`${current+1} / ${sequence.length}`;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===sequence.length-1;document.querySelector('.filmstrip').innerHTML=sequence.slice(Math.max(0,current-4),current+5).map(q=>`<button data-id="${q.id}" aria-label="写真 ${sequence.indexOf(q)+1}" aria-current="${q.id===p.id}"><img src="${esc(url(q,true))}" alt=""></button>`).join('');document.querySelectorAll('.filmstrip button').forEach(b=>b.onclick=()=>{current=sequence.findIndex(p=>p.id===+b.dataset.id);drawViewer()})}
function step(n){current=Math.max(0,Math.min(sequence.length-1,current+n));drawViewer()};document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.querySelector('#close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{document.body.style.overflow='';opener?.focus({preventScroll:true})});dialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;history.replaceState(null,'','?mode='+mode+location.hash);render();window.scrollTo(0,0)});window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);main.focus({preventScroll:true})});render();
</script></html>
