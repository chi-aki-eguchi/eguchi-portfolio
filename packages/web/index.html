<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon-v2.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-v2.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Generic fallback metadata. The Bun server replaces these values with
         site settings for deployed HTML responses. Keep this block free of
         production-only names/domains so template copies are safe before setup. -->
    <title>Photography Portfolio</title>
    <meta name="description" content="A quiet photography portfolio." />
    <meta name="author" content="Photographer" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://example.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Photography Portfolio" />
    <meta property="og:description" content="A quiet photography portfolio." />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Photography Portfolio" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="Photography Portfolio" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Photography Portfolio" />
    <meta name="twitter:description" content="A quiet photography portfolio." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Fonts: Shippori Mincho (和文明朝) + Cormorant Garamond (欧文セリフ) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- preload=fetch で CSS を早期取得し、フォントスワップによるCLSを最小化。
         preload href は stylesheet href と完全一致させること（不一致だと preload が無駄打ちになる）。 -->
    <link rel="preload" as="style" crossorigin href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Shippori+Mincho:wght@400;500;600&display=swap" />
    <link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Shippori+Mincho:wght@400;500;600&display=swap" />

    <meta name="theme-color" content="#f7f7f7" />
    <script>
      (function(){var t=localStorage.getItem("theme-preference");var d=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches);if(d)document.documentElement.dataset.theme="dark"})()
    </script>
  </head>
  <body>
    <noscript>
      <div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; color: #555; font-size: 14px; line-height: 2; letter-spacing: 0.03em; padding: 24px;">
        <p>このサイトの閲覧には JavaScript が必要です。<br />Please enable JavaScript to view this portfolio.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
