<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>接続できませんでした</title>
  <style>
    body{box-sizing:border-box;margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;background:#f7f7f7;color:#1a1a1a;text-align:center;padding:24px}
    @media(prefers-color-scheme:dark){body{background:#121212;color:#e8e8e8}}
    .wrap{max-width:360px}
    h1{font-size:clamp(24px,5vw,32px);font-weight:300;letter-spacing:0.04em;margin:0 0 16px}
    p{font-size:14px;line-height:1.8;opacity:0.75;margin:0 0 24px}
    button{color:inherit;background:transparent;border:1px solid currentColor;border-radius:0;min-height:44px;padding:10px 20px;font:inherit;font-size:14px;letter-spacing:0.04em;cursor:pointer}
    button:focus-visible{outline:2px solid currentColor;outline-offset:4px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>接続できませんでした</h1>
    <p>通信が不安定か、サイトが一時的に応答していない可能性があります。<br>少し置いて、もう一度お試しください。</p>
    <button id="retry" type="button">もう一度読み込む</button>
    <noscript><p>ブラウザーの再読み込みボタンからもお試しいただけます。</p></noscript>
  </main>
  <script>
    // Preserve the page and its query instead of sending every retry to home.
    function retryCurrentPage() { window.location.reload(); }
    document.getElementById("retry").addEventListener("click", retryCurrentPage);
    // A real offline-to-online transition gets one automatic recovery attempt.
    // Do not poll or keep reloading when the server itself is unavailable.
    window.addEventListener("online", retryCurrentPage, { once: true });
  </script>
</body>
</html>
