<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offline</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;background:#f7f7f7;color:#1a1a1a;text-align:center;padding:24px}
    @media(prefers-color-scheme:dark){body{background:#121212;color:#e8e8e8}}
    .wrap{max-width:360px}
    h1{font-size:clamp(28px,5vw,36px);font-weight:300;letter-spacing:0.06em;margin:0 0 16px}
    p{font-size:14px;line-height:1.8;opacity:0.5;margin:0 0 24px}
    a{color:inherit;opacity:0.4;font-size:12px;letter-spacing:0.08em;text-decoration:none;transition:opacity 0.3s}
    a:hover{opacity:0.7}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Offline</h1>
    <p>インターネットに接続されていません。</p>
    <a href="/">Retry</a>
  </div>
</body>
</html>
