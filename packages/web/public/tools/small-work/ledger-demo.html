'use strict';
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=(v,max=1000)=>{if(typeof v!=='string'||v.length>max)throw Error('文字の形式か長さを確認してください。');return v;};
const safeURL=value=>{if(!value)return '';try{const u=new URL(value);return ['https:','mailto:'].includes(u.protocol)&&!u.username&&!u.password?u.href:'';}catch{return '';}};
const csvCell=v=>'"'+((/^[\s]*[=+@-]/.test(String(v))?'\'':'')+String(v??'')).replace(/"/g,'""')+'"';
const csv=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';
function parseCSV(input){input=input.replace(/^\ufeff/,'');const rows=[];let row=[],value='',quoted=false;for(let i=0;i<input.length;i++){const c=input[i];if(quoted){if(c==='"'&&input[i+1]==='"'){value+='"';i++;}else if(c==='"')quoted=false;else value+=c;}else if(c==='"'&&value==='')quoted=true;else if(c===','){row.push(value);value='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&input[i+1]==='\n')i++;row.push(value);rows.push(row);row=[];value='';}else value+=c;}if(quoted)throw Error('CSVの引用符が閉じられていません。');if(row.length||value){row.push(value);rows.push(row);}return rows.filter(r=>r.some(v=>v!==''));}
const ledgerFields=['number','title','artist','year','medium','size','price','note'];
function validateLedger(data,limit){if(data?.kind!=='exhibition-ledger'||data.version!==1||!Array.isArray(data.works)||data.works.length>limit)throw Error('この版で開ける展示台帳ではありません。');return {kind:data.kind,version:1,exhibition:text(data.exhibition,160),style:['standard','quiet'].includes(data.style)?data.style:'standard',works:data.works.map(w=>Object.fromEntries(ledgerFields.map(k=>[k,text(w[k]??'',k==='note'?500:160)])))};}
function validateGallery(data,limit){if(data?.kind!=='one-exhibition'||data.version!==1||!Array.isArray(data.photos)||data.photos.length>limit)throw Error('この版で開ける展示データではありません。');return {kind:data.kind,version:1,title:text(data.title,160),author:text(data.author,160),statement:text(data.statement,3000),contact:text(data.contact,300),theme:['paper','dark'].includes(data.theme)?data.theme:'paper',photos:data.photos.map(p=>{if(typeof p.image!=='string'||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p.image)||p.image.length>8000000)throw Error('写真の形式かサイズを確認してください。');return {image:p.image,name:text(p.name,300),caption:text(p.caption,1000)};})};}
function galleryBody(data){const e=escapeHTML;return '<header><span>'+e(data.author)+'</span><span>EXHIBITION</span></header><main><section class="gallery-cover"><p class="eyebrow">'+e(data.author)+'</p><h1>'+e(data.title)+'</h1><p class="lead">'+e(data.statement)+'</p></section>'+data.photos.map((p,i)=>'<figure class="work-photo"><img src="'+p.image+'" alt="'+e(p.caption||'作品 '+(i+1))+'" loading="'+(i?'lazy':'eager')+'"><figcaption>'+e(p.caption)+'</figcaption></figure>').join('')+'<section class="gallery-contact"><p>© '+e(data.author)+'</p>'+(safeURL(data.contact)?'<a href="'+e(safeURL(data.contact))+'" rel="noopener noreferrer">お問い合わせ</a>':'')+'</section></main>';}
const api={escapeHTML,text,safeURL,csv,parseCSV,ledgerFields,validateLedger,validateGallery,galleryBody};root.SmallWork=api;

const $=id=>document.getElementById(id);
const e=SmallWork.escapeHTML;
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error);}
function download(name,content,type='text/plain;charset=utf-8'){const u=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status(name+' を保存しました。');}
async function jsonFile(file,max=8000000){if(!file)throw Error('ファイルを選んでください。');if(file.size>max)throw Error('保存データが大きすぎます。');return JSON.parse(await file.text());}

 $('works').innerHTML=ledger.works.map((w,i)=>'<section class="record"><div class="record-head"><strong>作品 '+(i+1)+'</strong><button data-remove="'+i+'" type="button">取り除く</button></div><div class="record-fields">'+SmallWork.ledgerFields.map(k=>'<label class="field '+(k==='note'?'wide':'')+'"><span>'+names[k]+'</span><input data-work="'+i+'" data-field="'+k+'" value="'+e(w[k])+'" maxlength="'+(k==='note'?500:160)+'"></label>').join('')+'</div></section>').join('');preview();}
function preview(){const labels=ledger.works.map(w=>'<article class="label-card"><span class="number">'+e(w.number)+'</span><h3>'+e(w.title||'作品名')+'</h3><p>'+e(w.artist)+'</p><p>'+[w.year,w.medium,w.size].filter(Boolean).map(e).join(' / ')+'</p>'+(w.price?'<p>'+e(w.price)+'</p>':'')+(w.note?'<p>'+e(w.note)+'</p>':'')+'</article>').join('');$('output').innerHTML='<h2>'+e(ledger.exhibition)+'</h2><div class="labels '+ledger.style+'">'+labels+'</div><div class="print-page"><h2>作品リスト</h2><div class="table-scroll"><table><thead><tr><th>番号</th><th>作品・作家</th><th>年・技法・寸法</th><th>価格・補足</th></tr></thead><tbody>'+ledger.works.map(w=>'<tr><td>'+e(w.number)+'</td><td>'+e(w.title)+'<br>'+e(w.artist)+'</td><td>'+[w.year,w.medium,w.size].filter(Boolean).map(e).join('<br>')+'</td><td>'+e(w.price)+'<br>'+e(w.note)+'</td></tr>').join('')+'</tbody></table></div></div>';}
$('works').addEventListener('input',ev=>{const el=ev.target;if(el.dataset.field){ledger.works[+el.dataset.work][el.dataset.field]=el.value;preview();}});
$('works').addEventListener('click',ev=>{const b=ev.target.closest('[data-remove]');if(b){ledger.works.splice(+b.dataset.remove,1);render();status('作品を取り除きました。保存した元ファイルは変わりません。');}});
on('exhibition',()=>{ledger.exhibition=$('exhibition').value;preview();},'input');on('label-style',()=>{ledger.style=$('label-style').value;preview();},'change');
on('add-work',()=>{if(ledger.works.length>=LIMIT)throw Error('この版は'+LIMIT+'作品までです。');ledger.works.push(Object.fromEntries(SmallWork.ledgerFields.map(k=>[k,k==='number'?String(ledger.works.length+1).padStart(2,'0'):''])));render();});
on('save-draft',()=>saveJSON('展示台帳.json',ledger));
on('load-draft',async ev=>{try{ledger=SmallWork.validateLedger(await jsonFile(ev.target.files[0]),LIMIT);render();status('展示台帳を開きました。');}finally{ev.target.value='';}},'change');
on('export-csv',()=>download('作品リスト.csv',SmallWork.csv([Object.values(names),...ledger.works.map(w=>SmallWork.ledgerFields.map(k=>w[k]))]),'text/csv;charset=utf-8'));
on('import-csv',async ev=>{try{const f=ev.target.files[0];if(!f)return;if(f.size>1000000)throw Error('CSVは1MB以下で開いてください。');const rows=SmallWork.parseCSV(await f.text());if(JSON.stringify(rows[0])!==JSON.stringify(Object.values(names)))throw Error('見本CSVと同じ見出し・順番にしてください。');const works=rows.slice(1).map(r=>{if(r.length!==8)throw Error('CSVの列数を確認してください。');return Object.fromEntries(SmallWork.ledgerFields.map((k,i)=>[k,r[i]]));});ledger=SmallWork.validateLedger({...ledger,works},LIMIT);render();status('CSVの作品を読み込みました。');}finally{ev.target.value='';}},'change');render();
</script></body></html>
