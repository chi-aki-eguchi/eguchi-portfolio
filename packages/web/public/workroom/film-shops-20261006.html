<template id="suzuki"><section class="fp suzuki">
<div class="section-title"><div class="eyebrow">郵送プリント</div><h2>データの受け取り方と料金</h2></div><p class="explain">35mmフルサイズ・C-41のカラーネガ１本、プリントなしの料金例です。</p>
<div class="inline-control"><span class="muted">料金の比較欄です。注文内容の選択ではありません。</span><label class="switch"><input type="checkbox" id="s-shipping">返送料を含む目安を見る</label></div>
<div role="table" aria-label="現像とデータ化１本の比較"><div class="price-head" role="row"><span role="columnheader">受け取り方法</span><span role="columnheader" id="s-price-heading">現像＋データ化（税込）</span><span role="columnheader">ネガ返却・注意</span></div>
<div class="price-row" role="row"><div role="cell"><b>CD</b><small>約300万画素</small></div><div role="cell"><strong id="s-cd">1,500円</strong><small>現像900円＋データ600円</small></div><div role="cell" class="return">ネガを返送<small>返送料600〜800円</small></div></div>
<div class="price-row alert" role="row"><div role="cell"><b>メール</b><small>URL受取／約300万画素</small></div><div role="cell"><strong>1,700円</strong><small>現像900円＋データ800円</small></div><div role="cell" class="return"><b>ネガの返却なし</b><small>店で処分・返送料なし</small></div></div>
<div class="price-row" role="row"><div role="cell"><b>DVD</b><small>約900万画素</small></div><div role="cell"><strong id="s-dvd">1,950円</strong><small>現像900円＋データ1,050円</small></div><div role="cell" class="return">ネガを返送<small>返送料600〜800円</small></div></div>
<div class="price-row" role="row"><div role="cell"><b>QRコードを送付</b><small>約300万画素</small></div><div role="cell"><strong id="s-qr">1,700円</strong><small>現像900円＋データ800円</small></div><div role="cell" class="return">返送条件を店舗に確認<small>不明な返送料は合算しません</small></div></div></div>
<p id="s-status" class="notice" aria-live="polite">表示額に、店まで送る送料や返送料は含みません。メール受取はネガの返送がありません。</p>
<div class="actions"><a class="button" href="https://suzukicamera.com/郵送オーダーシート" target="_blank" rel="noopener noreferrer">公式フォームで注文内容を指定 ↗</a><a class="button secondary" href="https://suzukicamera.com/郵送プリント" target="_blank" rel="noopener noreferrer">全料金・受付条件を見る ↗</a><p class="muted">この比較欄で注文情報は入力しません。正式な指定は公式フォームの１回だけです。</p></div>
<details class="details"><summary>対象フィルムと、料金例の範囲</summary><p>ハーフ・ブローニー・モノクロ・リバーサル・現像済みフィルム等は対象外。C-41表記でも種類により受付不可の場合があります。返送料の目安は注文額5,000円未満の１本で、レターパックプラス600円／ヤマト宅急便800円。複数本やプリント追加、QRの返送条件はこの欄では計算しません。最終金額は店舗の案内が優先されます。</p></details>
<div class="sources">参照：公式「郵送プリント」（2026年10月6日参照）。<a href="https://suzukicamera.com/郵送プリント" target="_blank" rel="noopener noreferrer">掲載元 ↗</a></div></section></template>
<template id="kei"><section class="fp kei"><div class="section-title"><div class="eyebrow">ネガ現像郵送受付</div><h2>料金確認と、送る前の準備</h2></div><p class="explain">35mm・C-41のカラーネガ、写ルンです等が対象。既存の注文依頼書をそのまま使います。</p>
<div class="split"><div><fieldset class="field"><legend>撮影したフォーマット</legend><div class="segments"><label><input name="k-format" type="radio" value="full" checked>フルサイズ</label><label><input name="k-format" type="radio" value="half">ハーフサイズ</label></div></fieldset><div class="field"><label class="label" for="k-method">料金を比較する</label><select id="k-method"><option value="cd">現像＋CD</option><option value="usb">現像＋USB</option><option value="dev">現像のみ</option></select></div><div class="receipt box tint" aria-live="polite"><span class="muted">フィルム１本・税込</span><p class="amount" id="k-price">1,400<small> 円</small></p><div class="pair"><span>返送料</span><strong>430〜600円</strong></div><div class="total-line"><span>現像等＋返送料の目安</span><b id="k-total">1,830〜2,000円</b></div><p class="tiny space">発送方法は店舗が判断します。店まで送る送料・プリント代・振込手数料等は別途。</p></div><p id="k-note" class="notice">フルサイズは１枚のCDにフィルム５本まで収録可能。料金は本数分かかります。</p></div>
<div class="box"><h3>同封前のチェック</h3><p class="muted">チェックは端末内だけ。店には送信されません。</p><div class="progress-line" aria-hidden="true"><div id="k-progress"></div></div><p id="k-count" class="tiny" aria-live="polite">0 / 4 項目を確認</p><div class="checklist"><label class="switch"><input type="checkbox" class="k-check"><span>公式の注文依頼書を印刷・記入した</span></label><label class="switch"><input type="checkbox" class="k-check"><span>対応するC-41フィルムか確認した</span></label><label class="switch"><input type="checkbox" class="k-check"><span>書き込み順の指定があれば、剥がれにくい番号メモを貼った</span></label><label class="switch"><input type="checkbox" class="k-check"><span>フィルムを破損しないよう梱包した</span></label><label class="switch" id="k-usb-check" hidden><input type="checkbox" class="k-check"><span>持ち込みUSB内に他のデータがないことを確認した</span></label></div><div class="actions"><a class="button" href="https://ph-kei.com/print/film_post/" target="_blank" rel="noopener noreferrer">公式案内で注文依頼書を開く ↗</a></div><p class="tiny space">ここでのフォーマット・仕上げ選択は料金確認用です。正式な依頼内容は、公式注文依頼書に記入してください。</p></div></div>

const $=id=>document.getElementById(id),selected=name=>document.querySelector(`input[name="${name}"]:checked`).value,yen=n=>n.toLocaleString('ja-JP')+'円';
if(key==='suzuki'){$('s-shipping').addEventListener('change',()=>{const on=$('s-shipping').checked;$('s-cd').textContent=on?'2,100〜2,300円':'1,500円';$('s-dvd').textContent=on?'2,550〜2,750円':'1,950円';$('s-qr').textContent=on?'返送料は要確認':'1,700円';$('s-price-heading').textContent=on?'現像＋データ＋返送料の目安':'現像＋データ化（税込）';$('s-status').textContent=on?'CD・DVDはレターパックプラス／ヤマトの返送料を加算。店までの送料は別途。QRの返送条件は不明なので合計を表示しません。':'表示額に、店まで送る送料や返送料は含みません。メール受取はネガの返送がありません。';});}
if(key==='kei'){
 function progress(){const checks=[...document.querySelectorAll('.k-check')].filter(el=>!el.closest('[hidden]')),n=checks.filter(el=>el.checked).length;$('k-count').textContent=`${n} / ${checks.length} 項目を確認`;$('k-progress').style.width=(100*n/checks.length)+'%';}
 function render(){const half=selected('k-format')==='half',method=$('k-method').value,price=method==='dev'?750:method==='usb'?1550:half?1550:1400;$('k-price').innerHTML=`${price.toLocaleString('ja-JP')}<small> 円</small>`;$('k-total').textContent=yen(price+430).replace('円','')+'〜'+yen(price+600);$('k-usb-check').hidden=method!=='usb';$('k-note').textContent=method==='dev'?'現像のみの料金例です。プリント等を追加する場合は公式注文依頼書で指定してください。':method==='usb'?'持ち込みUSBは原則として他のデータが入っていないものを用意。価格にUSB本体が含まれるとは扱っていません。':half?'ハーフサイズはフィルム１本につきCD１枚。複数本を１枚のCDにまとめられません。':'フルサイズは１枚のCDにフィルム５本まで収録可能。料金は本数分かかります。';progress();}
 document.querySelectorAll('input[name="k-format"],#k-method').forEach(el=>el.addEventListener('change',render));document.querySelectorAll('.k-check').forEach(el=>el.addEventListener('change',progress));render();
}
if(key==='photo21'){
 function render(){const raw=[$('p-full').value,$('p-half').value],nums=raw.map(Number),valid=raw.every(s=>s.trim()!=='')&&nums.every(n=>Number.isInteger(n)&&n>=0&&n<=20);$('p-invalid').hidden=valid;[$('p-full'),$('p-half')].forEach((el,i)=>el.setAttribute('aria-invalid',String(raw[i].trim()===''||!Number.isInteger(nums[i])||nums[i]<0||nums[i]>20)));if(!valid){$('p-total').textContent='—';$('p-detail').textContent='本数を修正すると料金を表示します。';['p-full-sum','p-half-sum','p-return-sum'].forEach(id=>$(id).textContent='—');return;}const [full,half]=nums,ret=selected('p-return')==='yes'&&(full+half)>0?200:0;$('p-full-label').textContent=`フルサイズ × ${full}本`;$('p-half-label').textContent=`ハーフサイズ × ${half}本`;$('p-full-sum').textContent=yen(full*1430);$('p-half-sum').textContent=yen(half*1760);$('p-return-sum').textContent=yen(ret);$('p-total').innerHTML=`${(full*1430+half*1760+ret).toLocaleString('ja-JP')}<small> 円</small>`;$('p-detail').textContent=full+half===0?'本数を入力してください。０本のときは返却料を加算しません。':ret?'ネガはクリックポストで返却。店までの送料・追加プリント代等は含みません。':'ネガ返却を希望しない条件です。注文書にも明記してください。店までの送料等は別途。';}
 document.querySelectorAll('#p-full,#p-half').forEach(el=>el.addEventListener('input',render));document.querySelectorAll('[name="p-return"]').forEach(el=>el.addEventListener('change',render));render();
}
if(key==='ebisu'){
 function render(){const mode=$('e-format').value,pair=mode==='pair';$('e-corrections').disabled=pair;$('e-warning').hidden=!pair;const lines=['【仕上がり希望メモ／公式注文書への追記用】'];if(mode==='single')lines.push('ハーフの仕上げ：１コマずつ');if(pair)lines.push('ハーフの仕上げ：２コマ１組（色・明暗補正なし）');if(!pair){lines.push(`明るさ：${$('e-bright').value}`,`色の印象：${$('e-color').value}`);const mood=$('e-mood').value.trim();if(mood)lines.push('希望の補足：'+mood);}const no=selected('e-return')==='no';lines.push(no?'ネガ返却：不要（公式注文書にも明記）':'ネガ返却：希望します','※仕上がりの相談メモです。対応可否は店舗確認。');$('e-output').textContent=lines.join('\n');$('e-negative').textContent=no?'返却不要の指定は、必ず最初の公式オーダーシートに記入。受付完了後の連絡では対応できないと案内されています。':'ネガ返却の希望も注文書に記入してください。店への受付完了後では変更できない条件があります。';$('e-copy-status').textContent='コピー後、公式注文書に書き添えてください。';}
 document.querySelectorAll('#e-format,#e-bright,#e-color,[name="e-return"]').forEach(el=>el.addEventListener('change',render));$('e-mood').addEventListener('input',render);$('e-copy').addEventListener('click',async()=>{const text=$('e-output').textContent;try{await navigator.clipboard.writeText(text);$('e-copy-status').textContent='コピーしました。店舗には送信していません。';}catch{const selection=window.getSelection(),range=document.createRange();range.selectNodeContents($('e-output'));selection.removeAllRanges();selection.addRange(range);$('e-copy-status').textContent='自動コピーできませんでした。選択された文章を手動でコピーしてください。';}});$('e-reset').addEventListener('click',()=>{$('e-format').value='normal';$('e-bright').selectedIndex=0;$('e-color').selectedIndex=0;$('e-mood').value='';document.querySelector('[name="e-return"][value="yes"]').checked=true;render();});render();
}
})();
</script></body></html>
