<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>一時的にページを開けません</title>
  <style>
    body{box-sizing:border-box;margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;font-family:Georgia,'Hiragino Mincho ProN',serif;background:#f7f7f7;color:#1a1a1a;text-align:center;padding:24px}
    @media(prefers-color-scheme:dark){body{background:#121212;color:#e8e8e8}}
    .wrap{max-width:400px}
    h1{font-size:clamp(22px,5vw,28px);font-weight:400;line-height:1.6;margin:0 0 16px}
    p{font-size:14px;line-height:1.8;opacity:0.75;margin:0 0 24px}
    a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;color:inherit;font-size:14px;text-underline-offset:4px}
    a:focus-visible{outline:2px solid currentColor;outline-offset:4px}
  </style>
  <script src="/offline-recovery.js" defer></script>
</head>
<body>
  <main class="wrap">
    <h1>一時的にページを開けません</h1>
    <p>通信またはサーバーへの接続に問題があります。<br>接続を確認して、再試行してください。</p>
    <a href="" id="retry">再試行</a>
  </main>
</body>
</html>
