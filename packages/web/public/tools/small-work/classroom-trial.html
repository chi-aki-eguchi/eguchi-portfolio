'use strict';
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=(v,max=1000)=>{if(typeof v!=='string'||v.length>max)throw Error('文字の形式か長さを確認してください。');return v;};
const safeURL=value=>{if(!value)return '';try{const u=new URL(value);return ['https:','mailto:'].includes(u.protocol)&&!u.username&&!u.password?u.href:'';}catch{return '';}};
const csvCell=v=>'"'+((/^[\s]*[=+@-]/.test(String(v))?'\'':'')+String(v??'')).replace(/"/g,'""')+'"';
const csv=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';
function parseCSV(input){input=input.replace(/^\ufeff/,'');const rows=[];let row=[],value='',quoted=false;for(let i=0;i<input.length;i++){const c=input[i];if(quoted){if(c==='"'&&input[i+1]==='"'){value+='"';i++;}else if(c==='"')quoted=false;else value+=c;}else if(c==='"'&&value==='')quoted=true;else if(c===','){row.push(value);value='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&input[i+1]==='\n')i++;row.push(value);rows.push(row);row=[];value='';}else value+=c;}if(quoted)throw Error('CSVの引用符が閉じられていません。');if(row.length||value){row.push(value);rows.push(row);}return rows.filter(r=>r.some(v=>v!==''));}

function validateLedger(data,limit){if(data?.kind!=='exhibition-ledger'||data.version!==1||!Array.isArray(data.works)||data.works.length>limit)throw Error('この版で開ける展示台帳ではありません。');return {kind:data.kind,version:1,exhibition:text(data.exhibition,160),style:['standard','quiet'].includes(data.style)?data.style:'standard',works:data.works.map(w=>Object.fromEntries(ledgerFields.map(k=>[k,text(w[k]??'',k==='note'?500:160)])))};}
function validateGallery(data,limit){if(data?.kind!=='one-exhibition'||data.version!==1||!Array.isArray(data.photos)||data.photos.length>limit)throw Error('この版で開ける展示データではありません。');return {kind:data.kind,version:1,title:text(data.title,160),author:text(data.author,160),statement:text(data.statement,3000),contact:text(data.contact,300),theme:['paper','dark'].includes(data.theme)?data.theme:'paper',photos:data.photos.map(p=>{if(typeof p.image!=='string'||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p.image)||p.image.length>8000000)throw Error('写真の形式かサイズを確認してください。');return {image:p.image,name:text(p.name,300),caption:text(p.caption,1000)};})};}

function classText(v,mode){const intro=v.name+'\n';const basic='日時：'+v.date+'\n会場：'+v.place+'\n対象：'+v.audience+'\n';const contact='申込・連絡先：'+v.contact;
 return {invite:intro+'\n'+v.content+'\n\n'+basic+'参加費：'+v.fee+'\n定員：'+v.capacity+'\n申込締切：'+v.deadline+'\n持ち物：'+v.bring+'\n\n'+contact+'\n欠席・キャンセル：'+v.cancel+'\n天候不良時：'+v.weather,
 confirmed:intro+'\nお申し込みありがとうございます。\n【受付状態・参加人数を確認して記入】\n\n'+basic+'参加費：'+v.fee+'\n持ち物：'+v.bring+'\n\n内容に誤りがあればご連絡ください。\n'+contact+'\n欠席・キャンセル：'+v.cancel,
 waitlist:intro+'\nお問い合わせありがとうございます。現在、募集枠は満席です。\n【待機を受け付けるか・順番・連絡期限を確認して記入】\n\nキャンセルが出た場合のご案内方法について、下記へお問い合わせください。\n'+contact,
 reminder:intro+'\nご参加前の確認です。\n\n'+basic+'持ち物：'+v.bring+'\n参加費：'+v.fee+'\n\n【会場の入口・受付開始時刻を記入】\n遅刻・欠席の連絡先：'+v.contact+'\n天候不良時：'+v.weather,
 weather:intro+'\n【開催する・延期する・中止する、いずれかを記入】\n\n変更理由：【確定した事実を記入】\n対象日時：'+v.date+'\n【振替日時・支払済み参加費の扱いを主催者が確認して記入】\n\n次のご案内時刻：【記入】\nお問い合わせ：'+v.contact,
 thanks:intro+'\nご参加ありがとうございました。\n【当日の具体的な感想を一文で記入】\n\n作品についてのご質問は、'+v.contact+' までお知らせください。\n【写真の共有は掲載許可を確認し、必要な場合だけ追記】\n【次回が確定している場合だけ日時と申込先を追記】'}[mode];}
let classroom={kind:'classroom-kit',version:1,fields:{...defaults},mode:'invite'};
function classPreview(){$('result-title').textContent=templateNames[classroom.mode];$('reply').textContent=classText(classroom.fields,classroom.mode);$('print-title').textContent=classroom.fields.name;$('print-content').textContent=classText(classroom.fields,'invite');}
function renderClass(){for(const k in defaults)$(k).value=classroom.fields[k];$('mode').value=classroom.mode;classPreview();}
for(const k in defaults)on(k,()=>{classroom.fields[k]=$(k).value;classPreview();},'input');
on('mode',()=>{classroom.mode=$('mode').value;classPreview();},'change');
on('download-text',()=>download(templateNames[classroom.mode]+'.txt',$('reply').textContent));
on('copy-text',async()=>{try{await navigator.clipboard.writeText($('reply').textContent);status('文面をコピーしました。送る前に未記入部分を確認してください。');}catch{$('reply').focus();const range=document.createRange();range.selectNodeContents($('reply'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);status('文面を選択しました。コピー操作で取り出してください。');}});
on('save-draft',()=>saveJSON('教室の募集帖.json',classroom));
on('load-draft',async ev=>{try{const d=await jsonFile(ev.target.files[0]);if(d.kind!=='classroom-kit'||d.version!==1||!templateNames[d.mode]||(TRIAL&&d.mode!=='invite'))throw Error('この版で開ける募集帖ではありません。');const fields=Object.fromEntries(Object.keys(defaults).map(k=>[k,SmallWork.text(d.fields?.[k],k==='content'?1500:500)]));classroom={kind:d.kind,version:1,fields,mode:d.mode};renderClass();status('募集帖を開きました。');}finally{ev.target.value='';}},'change');renderClass();
</script></body></html>
