<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>江口秋 — 写真</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="glass.css"></head>
<body><svg class="glass-definitions" aria-hidden="true"><defs id="glass-filters"></defs></svg><a class="skip" href="#content">写真へ移動</a>
<div class="app">
<aside class="sidebar glass"><a href="#selected" class="identity"><span>江口 秋<small>Aki Eguchi · Photographer</small></span></a><span class="section-label">作品</span><nav class="primary-nav" aria-label="主なページ"></nav><div class="sidebar-albums"><span class="section-label">シリーズ</span><a href="#series/4"><span class="album-dot island"></span>Ishigaki Island</a><a href="#series/3"><span class="album-dot indigo"></span>indigo blue</a></div><div class="sidebar-bottom"><a class="contact-link" href="https://akieguchi.com/contact">撮影のご相談 <span>↗</span></a><p>ポートレートと日常を、<br>デジタルとフィルムで。</p><span class="study-label">デザイン試作 · 本番未反映</span></div></aside>
<section class="workspace"><header class="toolbar glass" data-lens><div class="heading"><a id="back-series" href="#series" aria-label="シリーズへ戻る" hidden></a><div><h1 id="page-title">写真</h1><span id="page-count" class="muted"></span></div></div><div class="toolbar-actions"><label class="search"><span id="search-icon"></span><input id="search" type="search" placeholder="写真を検索" aria-label="写真を検索"><button id="search-clear" aria-label="検索を解除" hidden>×</button></label><button class="icon-button mobile-search" id="search-toggle" aria-label="検索を開く" aria-expanded="false"></button><a class="icon-button" href="https://akieguchi.com/contact" aria-label="撮影のご相談" id="contact-icon"></a></div></header>
<div id="controls" class="controls"><div class="segmented glass" aria-label="写真の範囲"><a href="#selected">セレクト</a><a href="#all">すべて</a></div><div class="view-tools glass"><select id="sort" aria-label="写真の並び順"><option value="curated">展示順</option><option value="newest">撮影日の新しい順</option><option value="oldest">撮影日の古い順</option></select><button class="icon-button" id="smaller" aria-label="写真を小さく"></button><label class="density"><span class="sr">写真の列数</span><input id="density" type="range" min="2" max="8" value="4" aria-label="写真の列数"></label><button class="icon-button" id="larger" aria-label="写真を大きく"></button><output id="density-count">4列</output></div></div>
<main id="content" tabindex="-1"><div id="page"></div></main><nav class="mobile-nav glass" data-lens aria-label="モバイルの主なページ"></nav></section>
</div>
<dialog id="viewer" aria-label="写真を見る"><div class="viewer-shell"><header class="viewer-toolbar"><button class="back-button glass glass-dark" id="viewer-close"></button><div class="viewer-heading glass glass-dark"><strong id="viewer-title">写真</strong><span id="viewer-count" class="muted" aria-live="polite"></span></div><button class="icon-button glass glass-dark" id="info-toggle" aria-label="写真の情報" aria-expanded="false"></button></header><div class="viewer-body"><div class="stage" id="stage"><div class="image-frame"><img id="viewer-image" alt=""></div><span id="image-loading" role="status"></span><button class="image-retry" id="image-retry" hidden>写真を再読み込み</button><button class="photo-arrow previous glass glass-dark" id="previous" aria-label="前の写真"></button><button class="photo-arrow next glass glass-dark" id="next" aria-label="次の写真"></button></div><aside id="info" class="info glass glass-dark" hidden><header><h2>写真の情報</h2><button class="icon-button" id="info-close" aria-label="情報を閉じる">×</button></header><dl id="info-fields"></dl></aside></div><footer class="viewer-bottom glass glass-dark" data-lens><div id="filmstrip" class="filmstrip" aria-label="前後の写真"></div></footer></div></dialog>
<script src="photos.js"></script><script src="app.js"></script><script src="glass.js"></script></body></html>
